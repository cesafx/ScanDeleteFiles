name: Pacchetto Windows portabile

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/hermes-codex-worker/acme-36
    paths:
      - ".github/workflows/windows-package.yml"
      - "pom.xml"
      - "mvnw.cmd"
      - ".mvn/**"
      - "src/**"

permissions:
  contents: read

jobs:
  package-and-smoke-test:
    name: Build, verifica ZIP e smoke test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configura Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test e creazione pacchetto
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "windows-package.log"
          & .\mvnw.cmd -B -Pwindows-package clean package 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content $log -Tail 50) -join "%0A"
            Write-Output "::error title=Creazione pacchetto Windows fallita::$tail"
            exit $LASTEXITCODE
          }

      - name: Verifica contenuto ZIP
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-ChildItem "target/ScanDeleteFiles-*.zip" | Select-Object -First 1
          if (-not $zip) { throw "Archivio ZIP non prodotto" }

          $extract = Join-Path $env:RUNNER_TEMP "ScanDeleteFiles-verifica"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $zip.FullName -DestinationPath $extract

          $exe = Get-ChildItem $extract -Filter "ScanDeleteFiles.exe" -Recurse | Select-Object -First 1
          $runtime = Get-ChildItem $extract -Filter "java.exe" -Recurse |
            Where-Object { $_.FullName -match "[\\/]runtime[\\/]bin[\\/]java.exe$" } |
            Select-Object -First 1
          $appDirectory = Get-ChildItem $extract -Directory -Recurse |
            Where-Object { $_.Name -eq "app" } |
            Select-Object -First 1

          if (-not $exe) { throw "Launcher ScanDeleteFiles.exe assente dallo ZIP" }
          if (-not $runtime) { throw "Runtime Java incorporato assente dallo ZIP" }
          if (-not $appDirectory) { throw "Directory applicativa assente dallo ZIP" }

          $forbidden = Get-ChildItem $extract -File -Recurse | Where-Object {
            $_.Extension -in ".java", ".csv", ".log" -or $_.Name -eq "preferences.json"
          }
          if ($forbidden) {
            throw "Lo ZIP contiene file vietati: $($forbidden.FullName -join ', ')"
          }

          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Smoke test launcher con solo runtime incorporato
        shell: pwsh
        env:
          APP_EXE: ${{ steps.package.outputs.exe }}
        run: |
          $ErrorActionPreference = "Stop"
          $savedJavaHome = $env:JAVA_HOME
          $env:JAVA_HOME = $null
          $env:Path = (($env:Path -split ";") |
            Where-Object { $_ -and $_ -notmatch "(?i)java|jdk|temurin" }) -join ";"

          if (Get-Command java -ErrorAction SilentlyContinue) {
            throw "Java di sistema ancora visibile durante lo smoke test"
          }

          $process = Start-Process -FilePath $env:APP_EXE -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            throw "Il launcher è terminato prematuramente con codice $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          $env:JAVA_HOME = $savedJavaHome

      - name: Pubblica ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ScanDeleteFiles-Windows-portabile
          path: target/ScanDeleteFiles-*.zip
          if-no-files-found: error
          retention-days: 14
